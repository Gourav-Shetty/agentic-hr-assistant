services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false # works with or without local keys (offline fallback)
    environment:
      - CHECKPOINT_DB=./data/checkpoints.db
      - CHROMA_DIR=./data/chroma
    volumes:
      - ./data:/app/data
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
